[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
evm_version = "cancun"
solc = "0.8.28"
auto_detect_solc = false
auto_detect_remappings = false
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read", path = "./proposals" },
    { access = "read", path = "./deployments" },
]

[fmt]
line_length = 120

[invariant]
# Handler actions contain executable oracles. Any unexpected handler revert must fail the campaign instead of being
# discarded, otherwise a reverted assertion could also roll back the state that the outer invariant needs to observe.
fail_on_revert = true

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
